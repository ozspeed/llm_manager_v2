<!-- [V2-7.1.7] Base Template with Persistent Navigation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}LLM Model Manager v2{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/theme.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div style="font-size: 2.1rem; font-weight: 700; color: var(--primary); letter-spacing: 1px;">LLM Model Manager v2</div>
            <div id="logo-placeholder" style="width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--primary-dark); font-weight: 600;">LM</div>
        </div>
        <nav>
            <a href="/">Models Library</a> |
            <a href="/huggingface">Hugging Face</a> |
            <a href="/settings">Settings</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme" title="Switch theme">🌙</button>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <small>&copy; 2025 LLM Model Manager v2</small>
    </footer>
</body>
</html>
