<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Model Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .model-card {
            transition: all 0.3s;
        }
        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .framework-badge {
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <h1 class="display-5 fw-bold">LLM Model Manager</h1>
            <p class="lead">Manage your local LLM models across different frameworks</p>
        </header>

        <!-- System Info -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">System Resources</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="system-info">
                            <div class="col-md-3">
                                <h6>Memory Usage</h6>
                                <div class="progress mb-2">
                                    <div id="memory-progress" class="progress-bar" role="progressbar"></div>
                                </div>
                                <div id="memory-details" class="small"></div>
                            </div>
                            <div class="col-md-3">
                                <h6>System Disk</h6>
                                <div class="progress mb-2">
                                    <div id="disk-progress" class="progress-bar bg-success" role="progressbar"></div>
                                </div>
                                <div id="disk-details" class="small"></div>
                            </div>
                            <div class="col-md-3">
                                <h6>Model Library</h6>
                                <div class="progress mb-2">
                                    <div id="library-progress" class="progress-bar bg-info" role="progressbar"></div>
                                </div>
                                <div id="library-details" class="small"></div>
                            </div>
                            <div class="col-md-3">
                                <h6>Models Summary</h6>
                                <p id="models-count" class="mb-1 small"></p>
                                <p id="models-size" class="mb-1 small"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Add New Model</h5>
                    </div>
                    <div class="card-body">
                        <form id="add-model-form">
                            <div class="mb-3">
                                <label for="model-name" class="form-label">Model Name</label>
                                <input type="text" class="form-control" id="model-name" required>
                            </div>
                            <div class="mb-3">
                                <label for="model-framework" class="form-label">Framework</label>
                                <select class="form-select" id="model-framework" required>
                                    <option value="llama.cpp">llama.cpp</option>
                                    <option value="transformers">Transformers</option>
                                    <option value="onnx">ONNX</option>
                                    <option value="pytorch">PyTorch</option>
                                    <option value="unknown">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="model-path" class="form-label">Model Path</label>
                                <input type="text" class="form-control" id="model-path" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Model</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Scan Library</h5>
                    </div>
                    <div class="card-body">
                        <p>Scan the model library to automatically add models.</p>
                        <div class="mb-3">
                            <label for="library-path" class="form-label">Library Path</label>
                            <input type="text" class="form-control" id="library-path" value="/Volumes/Library_Bolt/AI Model Library">
                        </div>
                        <button id="scan-library-btn" class="btn btn-success">Scan Library</button>
                        <div id="scan-results" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Models List -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Installed Models</h5>
                        <div>
                            <input type="text" id="search-models" class="form-control form-control-sm" placeholder="Search models...">
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="models-container" class="row g-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Format bytes to human-readable format
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Update system info
        async function updateSystemInfo() {
            try {
                const response = await fetch('/api/system-info');
                const data = await response.json();
                
                // Memory usage
                const memoryPercent = (data.memory.used / data.memory.total) * 100;
                document.getElementById('memory-progress').style.width = `${memoryPercent}%`;
                document.getElementById('memory-details').innerHTML = `
                    Used: ${formatBytes(data.memory.used)} / Total: ${formatBytes(data.memory.total)}
                `;
                
                // Root disk usage
                const diskPercent = (data.root_disk.used / data.root_disk.total) * 100;
                document.getElementById('disk-progress').style.width = `${diskPercent}%`;
                document.getElementById('disk-details').innerHTML = `
                    Used: ${formatBytes(data.root_disk.used)} / Total: ${formatBytes(data.root_disk.total)}
                `;
                
                // Library disk usage
                if (data.library_disk) {
                    const libraryPercent = (data.library_disk.used / data.library_disk.total) * 100;
                    document.getElementById('library-progress').style.width = `${libraryPercent}%`;
                    document.getElementById('library-details').innerHTML = `
                        Used: ${formatBytes(data.library_disk.used)} / Total: ${formatBytes(data.library_disk.total)}
                    `;
                } else {
                    document.getElementById('library-details').innerHTML = 'Library not found';
                }
                
                // Models summary
                document.getElementById('models-count').innerHTML = `Models: ${data.model_count}`;
                document.getElementById('models-size').innerHTML = `Total Size: ${formatBytes(data.total_model_size_mb * 1024 * 1024)}`;
            } catch (error) {
                console.error('Error fetching system info:', error);
            }
        }

        // Load models
        async function loadModels() {
            try {
                const response = await fetch('/api/models');
                const models = await response.json();
                const container = document.getElementById('models-container');
                const searchTerm = document.getElementById('search-models').value.toLowerCase();
                
                // Filter models based on search term
                const filteredModels = searchTerm 
                    ? models.filter(model => 
                        model.name.toLowerCase().includes(searchTerm) || 
                        model.framework.toLowerCase().includes(searchTerm) ||
                        model.path.toLowerCase().includes(searchTerm))
                    : models;
                
                // Generate HTML for models
                container.innerHTML = filteredModels.length 
                    ? filteredModels.map(model => `
                        <div class="col-md-4">
                            <div class="card model-card h-100">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <h5 class="card-title">${model.name}</h5>
                                        <span class="badge bg-${getBadgeColor(model.framework)} framework-badge">${model.framework}</span>
                                    </div>
                                    <p class="card-text small text-truncate" title="${model.path}">
                                        <strong>Path:</strong> ${model.path}
                                    </p>
                                    <p class="card-text">
                                        <strong>Size:</strong> ${formatBytes(model.size_mb * 1024 * 1024)}
                                    </p>
                                    ${model.config && model.config.is_sharded ? 
                                        `<p class="card-text small text-info">
                                            <i class="bi bi-layers"></i> Model is made of ${model.config.shard_count} shards
                                        </p>` : ''}
                                    <p class="card-text small">
                                        <strong>Last Used:</strong> ${new Date(model.last_used).toLocaleString()}
                                    </p>
                                </div>
                                <div class="card-footer bg-transparent border-top-0">
                                    <button class="btn btn-sm btn-danger delete-model" data-id="${model.id}">Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('')
                    : '<div class="col-12"><p class="text-center">No models found</p></div>';
                
                // Add event listeners for delete buttons
                document.querySelectorAll('.delete-model').forEach(button => {
                    button.addEventListener('click', async () => {
                        if (confirm('Are you sure you want to delete this model?')) {
                            await deleteModel(button.dataset.id);
                        }
                    });
                });
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }

        // Get badge color based on framework
        function getBadgeColor(framework) {
            const colors = {
                'llama.cpp': 'primary',
                'transformers': 'success',
                'onnx': 'info',
                'pytorch': 'warning',
                'unknown': 'secondary'
            };
            return colors[framework] || 'secondary';
        }

        // Add model
        async function addModel(event) {
            event.preventDefault();
            
            const name = document.getElementById('model-name').value;
            const framework = document.getElementById('model-framework').value;
            const path = document.getElementById('model-path').value;
            
            try {
                const response = await fetch('/api/models', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, framework, path })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('Model added successfully');
                    document.getElementById('add-model-form').reset();
                    loadModels();
                    updateSystemInfo();
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (error) {
                console.error('Error adding model:', error);
                alert('Failed to add model');
            }
        }

        // Delete model
        async function deleteModel(id) {
            try {
                const response = await fetch(`/api/models/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadModels();
                    updateSystemInfo();
                } else {
                    const result = await response.json();
                    alert(`Error: ${result.error}`);
                }
            } catch (error) {
                console.error('Error deleting model:', error);
                alert('Failed to delete model');
            }
        }

        // Scan library
        async function scanLibrary() {
            const path = document.getElementById('library-path').value;
            const resultsContainer = document.getElementById('scan-results');
            
            resultsContainer.innerHTML = '<div class="alert alert-info">Scanning library...</div>';
            
            try {
                const response = await fetch(`/api/scan?path=${encodeURIComponent(path)}`);
                const result = await response.json();
                
                if (response.ok) {
                    resultsContainer.innerHTML = `
                        <div class="alert alert-success">
                            Added ${result.added} models
                        </div>
                    `;
                    loadModels();
                    updateSystemInfo();
                } else {
                    resultsContainer.innerHTML = `
                        <div class="alert alert-danger">
                            Error: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error scanning library:', error);
                resultsContainer.innerHTML = `
                    <div class="alert alert-danger">
                        Failed to scan library
                    </div>
                `;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Load initial data
            updateSystemInfo();
            loadModels();
            
            // Set up event listeners
            document.getElementById('add-model-form').addEventListener('submit', addModel);
            document.getElementById('scan-library-btn').addEventListener('click', scanLibrary);
            document.getElementById('search-models').addEventListener('input', loadModels);
            
            // Update system info periodically
            setInterval(updateSystemInfo, 30000);
        });
    </script>
</body>
</html>
