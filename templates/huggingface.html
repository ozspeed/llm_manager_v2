<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugging Face Models - LLM Model Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #333;
            border-radius: 0;
            padding: 0.5rem 1rem;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .sidebar .nav-link:hover:not(.active) {
            background-color: #e9ecef;
        }
        .sidebar-heading {
            padding: 0.875rem 1.25rem;
            font-size: 1.2rem;
        }
        .main-content {
            padding: 1.5rem;
        }
        .model-card {
            transition: all 0.3s;
        }
        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 col-lg-2 d-md-block sidebar p-0">
                <div class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1">
                    <span>LLM Manager</span>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="/">
                            <i class="bi bi-house"></i>
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active d-flex align-items-center gap-2" href="/huggingface">
                            <i class="bi bi-cloud-download"></i>
                            Hugging Face
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="/settings">
                            <i class="bi bi-gear"></i>
                            Settings
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main content -->
            <div class="col-md-10 col-lg-10 main-content">
                <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-end">
                    <div>
                        <h1 class="display-5 fw-bold">Hugging Face Models</h1>
                        <p class="lead">Search, browse, and download models from Hugging Face Hub</p>
                    </div>
                    <div>
                        <button id="active-downloads-btn" class="btn btn-outline-primary">
                            <i class="bi bi-download"></i> Downloads <span id="active-downloads-count" class="badge bg-primary">0</span>
                        </button>
                    </div>
                </header>

                <!-- Search Section -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0">Search Models</h5>
                            </div>
                            <div class="card-body">
                                <form id="hf-search-form" class="mb-3">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="hf-search-query" placeholder="Search for models...">
                                        <select class="form-select" id="hf-search-task" style="max-width: 200px;">
                                            <option value="">All Tasks</option>
                                            <option value="text-generation" selected>Text Generation</option>
                                            <option value="text-classification">Text Classification</option>
                                            <option value="token-classification">Token Classification</option>
                                            <option value="translation">Translation</option>
                                            <option value="summarization">Summarization</option>
                                            <option value="question-answering">Question Answering</option>
                                            <option value="image-classification">Image Classification</option>
                                            <option value="image-segmentation">Image Segmentation</option>
                                            <option value="object-detection">Object Detection</option>
                                        </select>
                                        <button class="btn btn-primary" type="submit">
                                            <i class="bi bi-search"></i> Search
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="row">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header bg-secondary text-white">
                                <h5 class="mb-0" id="results-title">Popular Models</h5>
                            </div>
                            <div class="card-body">
                                <div id="hf-search-results">
                                    <div class="text-center" id="loading-indicator">
                                        <p>Loading popular models...</p>
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </div>
                                    <div class="row" id="models-container">
                                        <!-- Model cards will be added here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Model Details Modal -->
    <div class="modal fade" id="model-details-modal" tabindex="-1" aria-labelledby="model-details-modal-label" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="model-details-modal-label">Model Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="model-details-content">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <div class="version-selector">
                        <select class="form-select" id="model-version-select" aria-label="Model version">
                            <option value="main" selected>Default (main)</option>
                            <!-- Other versions will be added dynamically -->
                        </select>
                    </div>
                    <div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="download-model-btn">Download Model</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Active Downloads Modal -->
    <div class="modal fade" id="active-downloads-modal" tabindex="-1" aria-labelledby="active-downloads-modal-label" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="active-downloads-modal-label">Active Downloads</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="active-downloads-container">
                        <p class="text-center" id="no-downloads-message">No active downloads</p>
                        <!-- Active downloads will be added here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 5;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let currentModelId = null;
        let modelDetailsModal = null;
        let activeDownloadsModal = null;
        let activeDownloads = {};
        let downloadCheckInterval = null;

        // Format bytes to human-readable format
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0 || bytes === null || bytes === undefined) return 'Unknown';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
        
        // Format model card data into a readable HTML format
        function formatModelCardData(cardData) {
            if (!cardData || typeof cardData !== 'object') return 'No model information available.';
            
            // Convert the card data object to HTML
            let html = '<table class="table table-sm">';
            
            // Add rows for each property
            for (const [key, value] of Object.entries(cardData)) {
                if (value === null || value === undefined) continue;
                
                let displayValue = value;
                
                // Format arrays
                if (Array.isArray(value)) {
                    displayValue = value.join(', ');
                }
                // Format nested objects
                else if (typeof value === 'object') {
                    displayValue = JSON.stringify(value, null, 2);
                }
                
                html += `
                    <tr>
                        <th style="width: 30%">${key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</th>
                        <td>${displayValue}</td>
                    </tr>
                `;
            }
            
            html += '</table>';
            return html;
        }
        
        // Format README content to extract and display model information
        function formatReadme(readme) {
            if (!readme) return 'No README content available.';
            
            // Convert markdown to HTML (basic conversion)
            let html = '';
            
            // Replace markdown headers
            html = readme
                .replace(/^# (.+)$/gm, '<h2>$1</h2>')
                .replace(/^## (.+)$/gm, '<h3>$1</h3>')
                .replace(/^### (.+)$/gm, '<h4>$1</h4>')
                .replace(/^#### (.+)$/gm, '<h5>$1</h5>')
                .replace(/^##### (.+)$/gm, '<h6>$1</h6>');
            
            // Replace markdown links
            html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // Replace markdown emphasis
            html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
            
            // Replace newlines with <br>
            html = html.replace(/\n/g, '<br>');
            
            // Try to extract the Model Information section if it exists
            const modelInfoMatch = html.match(/<h[2-6]>Model Information<\/h[2-6]>([\s\S]*?)(<h[2-6]>|$)/);
            if (modelInfoMatch) {
                return modelInfoMatch[1];
            }
            
            // If no Model Information section, try to extract the Description section
            const descriptionMatch = html.match(/<h[2-6]>Description<\/h[2-6]>([\s\S]*?)(<h[2-6]>|$)/);
            if (descriptionMatch) {
                return descriptionMatch[1];
            }
            
            // If neither specific section is found, return the first 1000 characters
            return html.substring(0, 1000) + (html.length > 1000 ? '...' : '');
        }

        // Show toast message
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            
            const toastId = `toast-${Date.now()}`;
            const toastHtml = `
                <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-${type} text-white">
                        <strong class="me-auto">LLM Model Manager</strong>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;
            
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 5000 });
            toast.show();
            
            // Remove the toast element after it's hidden
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }

        // Load popular models
        async function loadPopularModels() {
            try {
                document.getElementById('loading-indicator').style.display = 'block';
                document.getElementById('models-container').innerHTML = '';
                document.getElementById('results-title').textContent = 'Popular Models';
                
                const response = await fetch('/api/huggingface/popular');
                if (!response.ok) {
                    throw new Error('Failed to load popular models');
                }
                
                const data = await response.json();
                renderModelResults(data.models);
            } catch (error) {
                console.error('Error loading popular models:', error);
                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('models-container').innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            Failed to load popular models. Error: ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Search models
        async function searchModels(event) {
            event.preventDefault();
            
            const query = document.getElementById('hf-search-query').value;
            const task = document.getElementById('hf-search-task').value;
            
            try {
                document.getElementById('loading-indicator').style.display = 'block';
                document.getElementById('models-container').innerHTML = '';
                document.getElementById('results-title').textContent = `Search Results: ${query || task || 'All Models'}`;
                
                const response = await fetch(`/api/huggingface/search?query=${encodeURIComponent(query)}&task=${encodeURIComponent(task)}`);
                if (!response.ok) {
                    throw new Error('Failed to search models');
                }
                
                const data = await response.json();
                renderModelResults(data.models);
            } catch (error) {
                console.error('Error searching models:', error);
                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('models-container').innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger">
                            Failed to search models. Error: ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Render model results
        function renderModelResults(models) {
            const container = document.getElementById('models-container');
            document.getElementById('loading-indicator').style.display = 'none';
            
            if (!models || models.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info">
                            No models found matching your criteria.
                        </div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            models.forEach(model => {
                const card = document.createElement('div');
                card.className = 'col-md-4 mb-4';
                card.innerHTML = `
                    <div class="card model-card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${model.name}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${model.author}</h6>
                            <div class="mb-2">
                                <span class="badge bg-primary">${model.pipeline_tag || 'Unknown'}</span>
                                ${model.library_name ? `<span class="badge bg-secondary">${model.library_name}</span>` : ''}
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">
                                    <i class="bi bi-download"></i> ${model.downloads.toLocaleString()} downloads
                                    <i class="bi bi-heart ms-2"></i> ${model.likes.toLocaleString()} likes
                                </small>
                            </div>
                            <a href="#" class="btn btn-outline-primary btn-sm view-details" data-model-id="${model.id}">
                                View Details
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            // Add event listeners to view details buttons
            document.querySelectorAll('.view-details').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const modelId = button.getAttribute('data-model-id');
                    openModelDetails(modelId);
                });
            });
        }

        // Open model details modal
        async function openModelDetails(modelId) {
            currentModelId = modelId;
            
            // Reset modal content
            document.getElementById('model-details-content').innerHTML = `
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            `;
            
            // Reset version selector
            const versionSelect = document.getElementById('model-version-select');
            versionSelect.innerHTML = '<option value="main" selected>Default (main)</option>';
            
            // Update modal title
            document.getElementById('model-details-modal-label').textContent = `Model Details: ${modelId.split('/').pop()}`;
            
            // Show modal
            modelDetailsModal.show();
            
            try {
                // Fetch model details
                const response = await fetch(`/api/huggingface/model/${encodeURIComponent(modelId)}`);
                if (!response.ok) {
                    throw new Error('Failed to load model details');
                }
                
                const model = await response.json();
                
                // Fetch model versions
                const versionsResponse = await fetch(`/api/huggingface/versions?model_id=${encodeURIComponent(modelId)}`);
                if (versionsResponse.ok) {
                    const versionsData = await versionsResponse.json();
                    
                    // Populate version selector
                    if (versionsData.versions) {
                        // Add tags
                        if (versionsData.versions.tags && versionsData.versions.tags.length > 0) {
                            const tagsOptgroup = document.createElement('optgroup');
                            tagsOptgroup.label = 'Tags';
                            
                            versionsData.versions.tags.forEach(tag => {
                                const option = document.createElement('option');
                                option.value = `tag:${tag}`;
                                option.textContent = tag;
                                tagsOptgroup.appendChild(option);
                            });
                            
                            versionSelect.appendChild(tagsOptgroup);
                        }
                        
                        // Add branches
                        if (versionsData.versions.branches && versionsData.versions.branches.length > 0) {
                            const branchesOptgroup = document.createElement('optgroup');
                            branchesOptgroup.label = 'Branches';
                            
                            versionsData.versions.branches.forEach(branch => {
                                // Skip main branch as it's already the default option
                                if (branch === 'main') return;
                                
                                const option = document.createElement('option');
                                option.value = `branch:${branch}`;
                                option.textContent = branch;
                                branchesOptgroup.appendChild(option);
                            });
                            
                            if (branchesOptgroup.children.length > 0) {
                                versionSelect.appendChild(branchesOptgroup);
                            }
                        }
                    }
                }
                
                // Update modal content
                document.getElementById('model-details-content').innerHTML = `
                    <div class="row">
                        <div class="col-md-12">
                            <h4>${model.name}</h4>
                            <h6 class="text-muted">by ${model.author}</h6>
                            
                            <div class="mb-3">
                                <span class="badge bg-primary">${model.pipeline_tag || 'Unknown'}</span>
                                ${model.library_name ? `<span class="badge bg-secondary">${model.library_name}</span>` : ''}
                                <span class="badge bg-success"><i class="bi bi-download"></i> ${model.downloads.toLocaleString()}</span>
                                <span class="badge bg-danger"><i class="bi bi-heart"></i> ${model.likes.toLocaleString()}</span>
                            </div>
                            
                            <div class="mb-3">
                                <h5>Model Information</h5>
                                <div class="card">
                                    <div class="card-body">
                                        ${typeof model.description === 'object' ? formatModelCardData(model.description) : 
                                          (typeof model.description === 'string' ? model.description.replace(/\n/g, '<br>') : 'No description available.')}
                                    </div>
                                </div>
                            </div>
                            
                            ${model.readme ? `
                            <div class="mb-3">
                                <h5>Model Description</h5>
                                <div class="card">
                                    <div class="card-body">
                                        <div class="readme-content">
                                            ${formatReadme(model.readme)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                            
                            <div class="mb-3">
                                <h5>Files</h5>
                                <div class="table-responsive">
                                    <table class="table table-striped table-sm">
                                        <thead>
                                            <tr>
                                                <th>Filename</th>
                                                <th>Type</th>
                                                <th>Size</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${model.siblings.map(file => `
                                                <tr>
                                                    <td>${file.name || file.rfilename}</td>
                                                    <td>${file.type || 'unknown'}</td>
                                                    <td>${file.size ? formatBytes(file.size) : 'Unknown'}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <a href="${model.url}" target="_blank" class="btn btn-outline-secondary">
                                    <i class="bi bi-box-arrow-up-right"></i> View on Hugging Face
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading model details:', error);
                document.getElementById('model-details-content').innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load model details. Error: ${error.message}
                    </div>
                `;
            }
        }

        // Download model
        async function downloadModel() {
            if (!currentModelId) {
                showToast('No model selected for download', 'danger');
                return;
            }
            
            try {
                // Disable download button
                const downloadBtn = document.getElementById('download-model-btn');
                downloadBtn.disabled = true;
                downloadBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Downloading...';
                
                // Get selected version
                const versionSelect = document.getElementById('model-version-select');
                const selectedVersion = versionSelect.value;
                
                // Prepare request payload
                const payload = {
                    model_id: currentModelId
                };
                
                // Add version info if not the default 'main'
                if (selectedVersion !== 'main') {
                    const [type, value] = selectedVersion.split(':');
                    if (type === 'tag') {
                        payload.revision = value;
                        payload.revision_type = 'tag';
                    } else if (type === 'branch') {
                        payload.revision = value;
                        payload.revision_type = 'branch';
                    }
                }
                
                const response = await fetch('/api/huggingface/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to download model');
                }
                
                const result = await response.json();
                
                // Add to active downloads
                if (result.download_id) {
                    activeDownloads[result.download_id] = {
                        model_id: currentModelId,
                        status: 'downloading',
                        progress: 0,
                        started_at: new Date().toISOString(),
                        version: selectedVersion !== 'main' ? selectedVersion.split(':')[1] : 'main'
                    };
                    
                    // Update downloads badge
                    updateDownloadsCount();
                    
                    // Start checking download status if not already checking
                    if (!downloadCheckInterval) {
                        downloadCheckInterval = setInterval(checkDownloadsStatus, 2000);
                    }
                    
                    // Show toast with download started
                    showToast(`Download started for ${currentModelId}`, 'info');
                }
                
                // Close modal
                modelDetailsModal.hide();
                
                // Reset current model
                currentModelId = null;
            } catch (error) {
                console.error('Error downloading model:', error);
                showToast(`Failed to download model: ${error.message}`, 'danger');
            } finally {
                // Re-enable download button
                const downloadBtn = document.getElementById('download-model-btn');
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = 'Download Model';
            }
        }

        // Update downloads count badge
        function updateDownloadsCount() {
            const count = Object.keys(activeDownloads).length;
            const countElement = document.getElementById('active-downloads-count');
            countElement.textContent = count;
            
            if (count > 0) {
                countElement.classList.remove('d-none');
            } else {
                countElement.classList.add('d-none');
                
                // Clear interval if no active downloads
                if (downloadCheckInterval) {
                    clearInterval(downloadCheckInterval);
                    downloadCheckInterval = null;
                }
            }
        }
        
        // Check status of all active downloads
        async function checkDownloadsStatus() {
            const downloadIds = Object.keys(activeDownloads);
            if (downloadIds.length === 0) {
                return;
            }
            
            for (const downloadId of downloadIds) {
                try {
                    const response = await fetch(`/api/huggingface/download/status?download_id=${downloadId}`);
                    if (!response.ok) {
                        continue;
                    }
                    
                    const status = await response.json();
                    
                    // Update download info
                    if (activeDownloads[downloadId]) {
                        activeDownloads[downloadId].status = status.status;
                        activeDownloads[downloadId].progress = status.progress || 0;
                        
                        // If completed or failed, show notification
                        if (status.status === 'completed') {
                            showToast(`Download completed: ${activeDownloads[downloadId].model_id}`, 'success');
                            delete activeDownloads[downloadId];
                            updateDownloadsCount();
                        } else if (status.status === 'failed') {
                            showToast(`Download failed: ${activeDownloads[downloadId].model_id} - ${status.error || 'Unknown error'}`, 'danger');
                            delete activeDownloads[downloadId];
                            updateDownloadsCount();
                        }
                    }
                } catch (error) {
                    console.error('Error checking download status:', error);
                }
            }
            
            // Update active downloads modal if it's open
            if (document.getElementById('active-downloads-modal').classList.contains('show')) {
                renderActiveDownloads();
            }
        }
        
        // Render active downloads in the modal
        function renderActiveDownloads() {
            const container = document.getElementById('active-downloads-container');
            const noDownloadsMessage = document.getElementById('no-downloads-message');
            
            const downloadIds = Object.keys(activeDownloads);
            
            if (downloadIds.length === 0) {
                noDownloadsMessage.classList.remove('d-none');
                container.innerHTML = '';
                return;
            }
            
            noDownloadsMessage.classList.add('d-none');
            
            let html = '';
            
            for (const downloadId of downloadIds) {
                const download = activeDownloads[downloadId];
                
                html += `
                    <div class="card mb-3" id="download-${downloadId}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0">${download.model_id}</h5>
                                <button class="btn btn-sm btn-danger cancel-download" data-download-id="${downloadId}">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </button>
                            </div>
                            <p class="card-text">
                                <small class="text-muted">
                                    Version: ${download.version || 'main'} | 
                                    Started: ${new Date(download.started_at).toLocaleTimeString()}
                                </small>
                            </p>
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" 
                                     style="width: ${download.progress}%" 
                                     aria-valuenow="${download.progress}" 
                                     aria-valuemin="0" 
                                     aria-valuemax="100">
                                    ${download.progress}%
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            
            // Add event listeners to cancel buttons
            document.querySelectorAll('.cancel-download').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const downloadId = button.getAttribute('data-download-id');
                    await cancelDownload(downloadId);
                });
            });
        }
        
        // Cancel a download
        async function cancelDownload(downloadId) {
            try {
                const response = await fetch(`/api/huggingface/download/cancel`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        download_id: downloadId
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to cancel download');
                }
                
                const result = await response.json();
                
                if (result.success) {
                    showToast(`Download cancelled for ${activeDownloads[downloadId]?.model_id || 'model'}`, 'info');
                    delete activeDownloads[downloadId];
                    updateDownloadsCount();
                    renderActiveDownloads();
                }
            } catch (error) {
                console.error('Error cancelling download:', error);
                showToast(`Failed to cancel download: ${error.message}`, 'danger');
            }
        }
        
        // Show active downloads modal
        function showActiveDownloadsModal() {
            renderActiveDownloads();
            activeDownloadsModal.show();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Bootstrap components
            modelDetailsModal = new bootstrap.Modal(document.getElementById('model-details-modal'));
            activeDownloadsModal = new bootstrap.Modal(document.getElementById('active-downloads-modal'));
            
            // Add event listeners
            document.getElementById('hf-search-form').addEventListener('submit', searchModels);
            document.getElementById('download-model-btn').addEventListener('click', downloadModel);
            document.getElementById('active-downloads-btn').addEventListener('click', showActiveDownloadsModal);
            
            // Load popular models on page load
            loadPopularModels();
            
            // Initialize downloads count
            updateDownloadsCount();
        });
    </script>
</body>
</html>
